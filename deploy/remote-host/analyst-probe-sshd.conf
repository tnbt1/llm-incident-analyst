# analyst-probe: 解析基盤（監視 VM のコンテナ）からの読み取りだけの確認。
# 鍵認証だけ、転送も端末も不可、動くのは実行器だけ（実行器は SSH_ORIGINAL_COMMAND の名前 1 語を自分の表で引く）。
# /etc/ssh/sshd_config.d/61-analyst-probe.conf に置く（docs/probes.md）。
Match User analyst-probe
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitTunnel no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
    MaxSessions 2
    ForceCommand /usr/local/lib/analyst-probe/run
Match all
