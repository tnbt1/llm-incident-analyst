name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --frozen
      - name: Test
        # Docker stand-in tests and headless-Chromium tests are marked and left out here.
        run: uv run pytest -W error -p no:cacheprovider -m "not docker and not browser"
      - name: Verify vendored assets
        run: uv run tools/vendor-assets.py --verify
      - name: Build wheel
        run: uv build --wheel -o dist
